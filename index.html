<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>棒人間💩うんち大避けゲーム</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5}
#start{background:linear-gradient(#6ed5ff 0 68%,#8bd45b 68%)}
#over{background:#0008;color:#fff}
.title{font-size:clamp(30px,8vw,52px);font-weight:900;line-height:1.12;color:#222;text-shadow:3px 3px #fff;margin:0 16px 12px}
#over .title{color:#fff;text-shadow:3px 3px #000}
.box{background:#fffffff0;border:3px solid #222;border-radius:18px;padding:12px 28px;margin:10px 0 20px;color:#222;box-shadow:0 5px 0 #0004}
.box small{display:block;font-weight:900}.box strong{font-size:34px}
button{border:3px solid #222;border-radius:16px;background:#ffd83d;padding:14px 30px;font-size:21px;font-weight:900;box-shadow:0 5px #222}
button:active{transform:translateY(4px);box-shadow:0 1px #222}
.sound{margin-top:16px;background:#fff;color:#222;border:2px solid #222;border-radius:12px;padding:8px 14px;font-weight:800}
.hidden{display:none!important}
#hud{position:fixed;top:8px;left:8px;right:8px;z-index:4;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.hudbox{background:#fffffff0;border:2px solid #222;border-radius:12px;padding:6px 9px;font-weight:900;min-width:105px}
#hpbar{height:13px;background:#ddd;border:2px solid #222;border-radius:10px;overflow:hidden;margin-top:3px}
#hpfill{height:100%;width:100%;background:#45c95b}
#status{position:fixed;top:70px;left:0;right:0;z-index:4;text-align:center;font-weight:1000;font-size:18px;color:#222;text-shadow:0 2px #fff;pointer-events:none}
.hint{position:absolute;bottom:10px;font-size:12px;color:#2229}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start" class="screen">
<h1 class="title">棒人間💩<br>うんち大避けゲーム</h1>
<div>降り注ぐうんちをよけて、できるだけ長く生き残れ！</div>
<div class="box"><small>HIGH SCORE</small><strong id="high">0.00秒</strong></div>
<button id="startBtn">GAME START</button>
<div id="sound" class="sound">🎵 ホームBGM ON</div>
<div class="hint">画面をタップしたまま左右にスライドして移動</div>
</div>

<div id="hud" class="hidden">
<div class="hudbox">TIME<br><span id="time">0.00</span> 秒</div>
<div class="hudbox">HP <span id="hp">100</span><div id="hpbar"><div id="hpfill"></div></div></div>
</div>
<div id="status"></div>

<div id="over" class="screen hidden">
<h1 class="title">GAME OVER</h1>
<div class="box"><small>SURVIVAL TIME</small><strong id="final">0.00秒</strong><div id="record"></div></div>
<button id="retry">RETRY</button>
<div id="sound2" class="sound">🎵 ホームBGM ON</div>
</div>

<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);

const KEY='stickman_poop_highscore';
let highscore=+localStorage.getItem(KEY)||0;
high.textContent=highscore.toFixed(2)+'秒';

let playing=false,last=0,startTime=0,t=0,HP=100;
let poop=[],items=[],target=W/2,down=false,spawn=0,itemSpawn=2;
let inv=0,slow=0,fast=0,audio=null,music=null,homeMusic=null,bgm=true;
const player={x:W/2,y:0,w:34,h:62};
const ground=()=>H-58;
function reset(){player.x=W/2;player.y=ground()-player.h;target=player.x}

function tone(f,d=.12,type='sine',v=.04){
 if(!bgm||!audio)return;
 const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
 o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);
}
function audioStart(){
 if(!bgm)return;
 if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
 if(audio.state==='suspended')audio.resume();
 if(music)return;
 let n=0,notes=[262,330,392,330,294,349,440,349];
 music=setInterval(()=>{if(playing)tone(notes[n++%notes.length],.1,'triangle',.025)},250);
}
function homeBgmStart(){
 if(!bgm)return;
 if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();
 if(audio.state==='suspended')audio.resume();
 if(homeMusic)return;
 let n=0,notes=[392,494,587,494,440,523,659,523];
 homeMusic=setInterval(()=>{
   if(!playing) tone(notes[n++%notes.length],.32,'sine',.018);
 },520);
}
function sfx(kind){
 const m={hit:90,gold:65,green:150,heart:660,plunger:180,toilet:110,slipper:520,over:80};
 if(!audio)audioStart(); if(!audio)return;tone(m[kind]||300,.15,kind==='hit'?'sawtooth':'sine',.07);
 if(kind==='heart'||kind==='slipper')setTimeout(()=>tone(m[kind]*1.5,.12,'sine',.05),70);
}

function startGame(){
 if(homeMusic){clearInterval(homeMusic);homeMusic=null}
 start.classList.add('hidden');over.classList.add('hidden');hud.classList.remove('hidden');
 playing=true;HP=100;t=0;poop=[];items=[];inv=slow=fast=0;spawn=0;itemSpawn=1.5;
 reset();startTime=performance.now();last=startTime;status.textContent='';
 audioStart();requestAnimationFrame(loop);
}
startBtn.onclick=startGame;retry.onclick=startGame;
document.addEventListener('pointerdown',()=>{if(!playing)homeBgmStart()},{once:false});
function toggle(){bgm=!bgm;document.querySelectorAll('.sound').forEach(e=>e.textContent=bgm?'🔊 BGM ON':'🔇 BGM OFF');if(bgm&&playing)audioStart()}
sound.onclick=toggle;sound2.onclick=toggle;

function spawnPoop(){
 let r=Math.random(),type=r<.13?'gold':r<.29?'green':'pink';
 poop.push({x:25+Math.random()*(W-50),y:-30,s:type==='gold'?31:28,type,vy:145+Math.random()*75+t*3,rot:Math.random()*6.2});
}
function spawnItem(){
 let r=Math.random(),type=r<.28?'heart':r<.52?'plunger':r<.75?'toilet':'slipper';
 items.push({x:28+Math.random()*(W-56),y:-30,type,vy:120+Math.random()*45});
}
function hit(o){
 let r=o.s?o.s*.55:16,px=Math.max(player.x-player.w/2,Math.min(o.x,player.x+player.w/2)),py=Math.max(player.y,Math.min(o.y,player.y+player.h));
 return (o.x-px)**2+(o.y-py)**2<r*r;
}
function update(dt){
 t=(performance.now()-startTime)/1000;
 let sp=360;if(t<slow)sp*=.42;if(t<fast)sp*=1.75;
 let dx=target-player.x;player.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);player.x=Math.max(17,Math.min(W-17,player.x));
 spawn-=dt;
 if(spawn<=0){spawnPoop();if(t>25&&Math.random()<.22)spawnPoop();spawn=Math.max(.22,1-t*.008)*(.65+Math.random()*.45)}
 itemSpawn-=dt;if(itemSpawn<=0){spawnItem();itemSpawn=4.5+Math.random()*5}

 for(let i=poop.length-1;i>=0;i--){
  let p=poop[i];p.y+=p.vy*dt;p.rot+=dt*2;
  if(hit(p)){
   if(t>=inv){let dmg=p.type==='gold'?20:8;HP=Math.max(0,HP-dmg);sfx(p.type);if(p.type==='green')slow=Math.max(slow,t+3);status.textContent=p.type==='green'?'🟢 3秒間スピードダウン！':'💥 HP -'+dmg}
   poop.splice(i,1);continue
  }
  if(p.y>H+50)poop.splice(i,1);
 }
 for(let i=items.length-1;i>=0;i--){
  let a=items[i];a.y+=a.vy*dt;
  if(hit(a)){
   if(a.type==='heart'){HP=Math.min(100,HP+10);status.textContent='❤️ HP +10'}
   if(a.type==='plunger'){inv=t+10;status.textContent='🪠 10秒間 無敵！'}
   if(a.type==='toilet'){poop=[];status.textContent='🚽 ジャーーーッ！ うんち全消去！'}
   if(a.type==='slipper'){fast=t+5;status.textContent='🩴 5秒間 スピードアップ！'}
   sfx(a.type);setTimeout(()=>status.textContent='',900);items.splice(i,1);continue
  }
  if(a.y>H+50)items.splice(i,1);
 }
 time.textContent=t.toFixed(2);hp.textContent=HP;hpfill.style.width=HP+'%';
 if(HP<=0)end();
}
function cloud(cx,cy,s){x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,24*s,0,7);x.arc(cx+28*s,cy-12*s,30*s,0,7);x.arc(cx+58*s,cy,23*s,0,7);x.rect(cx-2*s,cy,cx+62*s,cy+25*s);x.fill()}
function drawPoop(p){
 x.save();x.translate(p.x,p.y);x.rotate(p.rot);
 const s=p.s*1.18;
 const col=p.type==='gold'?'#ffd22e':p.type==='green'?'#39b94a':'#f38ab5';
 x.strokeStyle='#5b3420';x.lineWidth=Math.max(2,s*.08);x.lineJoin='round';
 // Three unmistakable stacked tiers.
 x.fillStyle=col;
 x.beginPath();
 x.moveTo(-s*.78,s*.42);
 x.bezierCurveTo(-s*.92,s*.05,-s*.72,-s*.12,-s*.48,-s*.10);
 x.bezierCurveTo(-s*.55,-s*.38,-s*.28,-s*.50,0,-s*.42);
 x.bezierCurveTo(s*.28,-s*.50,s*.55,-s*.38,s*.48,-s*.10);
 x.bezierCurveTo(s*.72,-s*.12,s*.92,s*.05,s*.78,s*.42);
 x.bezierCurveTo(s*.45,s*.62,-s*.45,s*.62,-s*.78,s*.42);x.closePath();x.fill();x.stroke();
 x.beginPath();
 x.moveTo(-s*.58,-s*.10);
 x.bezierCurveTo(-s*.72,-s*.30,-s*.55,-s*.52,-s*.28,-s*.48);
 x.bezierCurveTo(-s*.30,-s*.70,-s*.12,-s*.82,0,-s*.76);
 x.bezierCurveTo(s*.12,-s*.82,s*.30,-s*.70,s*.28,-s*.48);
 x.bezierCurveTo(s*.55,-s*.52,s*.72,-s*.30,s*.58,-s*.10);
 x.bezierCurveTo(s*.35,.03,-s*.35,.03,-s*.58,-s*.10);x.closePath();x.fill();x.stroke();
 x.beginPath();
 x.moveTo(-s*.30,-s*.48);
 x.bezierCurveTo(-s*.38,-s*.64,-s*.25,-s*.82,-s*.08,-s*.80);
 x.bezierCurveTo(-s*.16,-s*.98,s*.10,-s*1.05,s*.14,-s*.84);
 x.bezierCurveTo(s*.34,-s*.78,s*.40,-s*.58,s*.30,-s*.48);
 x.bezierCurveTo(s*.18,-s*.34,-s*.18,-s*.34,-s*.30,-s*.48);x.closePath();x.fill();x.stroke();
 // Cute highlight / face, keeping variants readable.
 x.fillStyle='rgba(255,255,255,.45)';
 x.beginPath();x.ellipse(-s*.42,s*.17,s*.12,s*.07,-.3,0,7);x.fill();
 x.restore();
}
function draw(){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#67d4ff');g.addColorStop(.72,'#c5f1ff');g.addColorStop(.72,'#8ed65e');g.addColorStop(1,'#62b94a');x.fillStyle=g;x.fillRect(0,0,W,H);
 cloud(W*.1,95,1);cloud(W*.72,145,.8);cloud(W*.42,50,.55);
 x.fillStyle='#65bb4b';x.fillRect(0,ground(),W,H-ground());
 poop.forEach(drawPoop);
 items.forEach(a=>{x.font='28px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText({heart:'❤️',plunger:'🪠',toilet:'🚽',slipper:'🩴'}[a.type],a.x,a.y)});
 x.save();x.translate(player.x,player.y);
 if(t<inv)x.globalAlpha=.35+Math.abs(Math.sin(t*12))*.65;
 x.strokeStyle='#222';x.fillStyle='#222';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(0,10,11,0,7);x.fill();
 x.beginPath();x.moveTo(0,21);x.lineTo(0,47);x.moveTo(0,27);x.lineTo(-14,38);x.moveTo(0,27);x.lineTo(14,38);x.moveTo(0,47);x.lineTo(-12,61);x.moveTo(0,47);x.lineTo(12,61);x.stroke();
 if(t<inv){x.strokeStyle='#39f';x.lineWidth=3;x.beginPath();x.arc(0,35,30+Math.sin(t*8)*3,0,7);x.stroke()}x.restore();
}
function loop(now){if(!playing)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(playing)requestAnimationFrame(loop)}
function end(){playing=false;hud.classList.add('hidden');over.classList.remove('hidden');homeBgmStart();final.textContent=t.toFixed(2)+'秒';
 if(t>highscore){highscore=t;localStorage.setItem(KEY,highscore);record.textContent='🏆 NEW HIGH SCORE!'}else record.textContent='HIGH SCORE '+highscore.toFixed(2)+'秒';sfx('over')}
c.addEventListener('pointerdown',e=>{if(playing){down=true;target=e.clientX;c.setPointerCapture?.(e.pointerId)}})
c.addEventListener('pointermove',e=>{if(down)target=e.clientX})
c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
document.addEventListener('touchmove',e=>{if(playing)e.preventDefault()},{passive:false});
</script>
</body>
</html>
